master_volume = 0.5
vol_default = 0.5
seal_check_threshold = 200

# Dual-tone test playback volume fraction (f2)
[profiles.ugreen_80864_rpi5.vol1_defaults]
2016 = 0.50
2953 = 0.35
3985 = 1.00
4969 = 1.00

